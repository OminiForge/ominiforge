name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
  # 每周一 02:00 UTC 自动更新 Release PR（版本/ changelog 就绪），
  # 是否合并发版仍由你决定。想改成两周/一月，调 cron 即可。
  schedule:
    - cron: "0 2 * * 1"

# release-plz 驱动发布：解析 Conventional Commits 维护一个 Release PR（bump 版本 +
# 生成 CHANGELOG）；合并后打 tag、建 GitHub Release、按拓扑序发布可发布的 crate
#（ominiforge → ominiforge-net → ominiforge-cli）到 crates.io。
# 全程无需人手改版本号。GUI 桌面包在 GPUI 客户端成熟后接入（当前占位）。

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # release-pr：维护/更新 Release PR。push / 定时 / 手动 都跑，保持 PR 最新。
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release：真正打 tag + 发 crates.io + 建 Release。**只在 push（合并 Release PR）时跑**，
      # 定时/手动触发绝不执行——否则定时到点会未经合并就自动发版。
      - name: Release (tag + GitHub Release + crates.io publish)
        if: github.event_name == 'push'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # 每次 push 到 master（含发布）重建全版本文档站并部署到 GitHub Pages。
  # 定时/手动触发不重新部署（文档只在代码实际变更后更新）。
  docs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history is needed to build each version's docs
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Build multi-version doc site
        run: nix develop --command doc/build-all-versions.sh doc/site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
