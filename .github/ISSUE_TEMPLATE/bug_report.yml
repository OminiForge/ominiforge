name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please give minimal, reproducible detail — a vague
        "it doesn't work" is hard to act on.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you actually get, and what did you expect?
      placeholder: I ran X, expected Y, but got Z.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smaller the better.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: ominiforge version or commit hash.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - NixOS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / errors
      description: Paste output inside a code block.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else, screenshots, related issues.
