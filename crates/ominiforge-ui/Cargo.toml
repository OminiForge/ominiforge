[package]
name = "ominiforge-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI component library (theme, components, panels)"
publish = false

[dependencies]
# 组件层自建（不用 gpui-component），框架本体是唯一 UI 依赖。
gpui.workspace = true
ominiforge-core = { path = "../ominiforge-core" }
ominiforge-net = { path = "../ominiforge-net" }
futures-lite = "2"
anyhow = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# TestAppContext 无窗口测试（doc/gpui-app.md §8 验证矩阵 B）。
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
