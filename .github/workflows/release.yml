name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# release-plz 驱动发布：解析 Conventional Commits 维护一个 Release PR（bump 版本 +
# 生成 CHANGELOG）；合并后打 tag、建 GitHub Release、按拓扑序发布可发布的 crate
#（ominiforge → ominiforge-net → ominiforge-cli）到 crates.io。
# 全程无需人手改版本号。GUI 桌面包在 GPUI 客户端成熟后接入（当前占位）。

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # release-pr：维护/更新 Release PR；release：合并后发布（tag + Release + publish）。
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Release (tag + GitHub Release + crates.io publish)
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # 每次 push 到 master（含发布）重建全版本文档站并部署到 GitHub Pages。
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history is needed to build each version's docs
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Build multi-version doc site
        run: nix develop --command doc/build-all-versions.sh doc/site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
