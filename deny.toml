[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "warn"
# (The gpui transitive-dep advisory ignores were removed in the zero-UI pivot:
# gpui and its zed dependency closure are no longer in the tree.)
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # MPL-2.0: weak copyleft (file-level); statically linking a Rust crate is not
  # infectious — only modifications to MPL files themselves must be published. From
  # cssparser/selectors/dtoa-short (the Readability extraction chain of dom_smoothie ->
  # the web_fetch tool).
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
# workspace inheritance (`dep.workspace = true`) and path deps are false-reported by
# cargo deny as wildcards (present since baseline 0.2.2, not introduced here). A real
# crates.io wildcard (`dep = "*"`) is the actual risk, but we do not publish crates, so
# this is downgraded to warn and caught by review.
wildcards = "warn"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies remain (the zed git pin for gpui was removed in the zero-UI pivot).
allow-git = []
