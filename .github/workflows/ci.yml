name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# nix flake check lives in ci-nix.yml (it alone has a paths filter: the expensive sandboxed
# offline full build runs only when dependency/toolchain/CI definitions change). This file
# keeps only the cargo job — it must run on every PR.
jobs:
  cargo:
    name: Cargo build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Use Cachix
        uses: cachix/cachix-action@v15
        with:
          name: ominiforge
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # clippy/test target is reused across runs; the sandboxed cargo-check (ci-nix.yml) solely
      # owns the `check` duty, so `just check` is not run here (avoids compiling the same
      # dependency tree twice).
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-job
      # Use the slim devShells.ci (flake.nix): no frontend/LSP/local-dev tools, faster to realize.
      - name: Format
        run: nix develop .#ci --command just fmt-check
      - name: Clippy
        run: nix develop .#ci --command just clippy
      - name: Test
        run: nix develop .#ci --command just test
      - name: Audit
        run: nix develop .#ci --command just audit
      - name: Deny
        run: nix develop .#ci --command just deny
      - name: Machete
        run: nix develop .#ci --command just machete
