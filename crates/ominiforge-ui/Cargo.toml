[package]
name = "ominiforge-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI component library (theme, components, panels)"
publish = false

[dependencies]
# Component layer is built in-house (no gpui-component); the framework itself is the only UI dependency.
gpui.workspace = true
ominiforge = { path = "../ominiforge", version = "0.1" }
ominiforge-net = { path = "../ominiforge-net", version = "0.1" }
futures-lite = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
# Integration tests drive a real in-process core (LocalProtocol + ScriptedProvider):
# tokio runs the core's actor/spawn, tempfile provides a scratch workspace.
tokio = { version = "1", features = ["rt", "macros", "time"] }
tempfile = "3"
# TestAppContext windowless tests (doc/gpui-app.md §8 verification matrix B).
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
