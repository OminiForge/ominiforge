# release-plz: per-crate changelogs plus an aggregated root changelog.
#
# Two release surfaces: the pure-CLI build and the GUI build (the GUI is a
# placeholder until the GPUI client matures). Both share the workspace version.

[workspace]
changelog_update = true
# Update Cargo.lock dependency pins as part of the release PR.
dependencies_update = true

# The pure-CLI crate is the user-facing `ominiforge` product. Point its changelog at
# the repository root and fold in the core and net changes, so the root CHANGELOG.md
# is the aggregated, product-level history while each crate still keeps its own
# fine-grained changelog.
[[package]]
name = "ominiforge-cli"
changelog_path = "CHANGELOG.md"
changelog_include = ["ominiforge", "ominiforge-net"]

# ominiforge, ominiforge-net, ominiforge-cli keep their default per-crate CHANGELOG.md.
# ominiforge-ui / ominiforge-gui are publish = false, so release-plz skips publishing
# them; the git release body defaults to the changelog, so each tag shows what changed.
