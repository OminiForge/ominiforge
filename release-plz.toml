# release-plz：统一版本 + 单 tag + 单 Release + 汇总 changelog。
#
# 对**用户**只有一个产品 ominiforge、一个版本号、一个 tag（v0.x.0）。该 tag 的 GitHub
# Release 正文是汇总 changelog，并挂载两类二进制（纯 CLI、未来的 GUI+CLI），各覆盖
# Linux/macOS/Windows。对 **crates.io** 仍 per-crate 发布（core/cli 各自 publish），
# 与 git tag/release 相互独立。
#
# 单 tag 的正确做法（release-plz 官方）：默认关闭所有 crate 的 git tag/release，
# 只给主 crate ominiforge-cli 开启。

[workspace]
changelog_update = true
# 关闭 cargo-semver-checks：首发无已发布基线可对比，且在 gpui 这种大依赖项目上编译极慢。
semver_check = false
# 更新 Cargo.lock 依赖钉。
dependencies_update = true
# 默认不打 tag、不建 Release（各 crate 仅发 crates.io）。
git_tag_enable = false
git_release_enable = false

# 统一版本：三个可发布 crate 绑为一组，同号演进。
[[package]]
name = "ominiforge"
version_group = "product"

# ominiforge-cli 是面向用户的主产物：
# - 唯一的 tag/Release 由它产生，tag 名为 v<version>（去 crate 前缀）。
# - 它的 changelog 指向仓库根并聚合 core，作为该单 Release 的正文来源。
[[package]]
name = "ominiforge-cli"
version_group = "product"
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
git_release_body = "{{ changelog }}"
changelog_path = "CHANGELOG.md"
changelog_include = ["ominiforge"]

# ominiforge-ui / ominiforge-gui 为 publish = false，不发 crates.io，也不打 tag。
