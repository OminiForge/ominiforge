[workspace]
resolver = "2"
members = [
  "crates/ominiforge-app",
  "crates/ominiforge-core",
  "crates/ominiforge-editor",
  "crates/ominiforge-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/replace-me/ominiforge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
