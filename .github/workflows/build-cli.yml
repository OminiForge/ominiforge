name: Build CLI binaries

# Release flow: release-plz tags ominiforge-cli (after the Release PR merges) -> creates a
# GitHub Release -> this workflow builds pure-CLI binaries for the three platforms and uploads
# them to that Release.
#
# The artifacts are **bare executables** (single file, no archive): download and run, `chmod +x`
# on Unix. Filenames carry a platform suffix to tell them apart; once installed on PATH they are
# all called `ominiforge` (a package manager / cargo install produces no suffix anyway).
#
# Structure: one job per platform only builds, storing the binary as an artifact; a final Linux
# job downloads all artifacts and uploads them to the Release. Upload runs only on Linux,
# sidestepping gh release upload shell/glob issues on the Windows runner.
#
# Platforms & dependencies:
# - Linux uses musl static linking -> self-contained binary, runs on any distro, no glibc version dependency.
# - macOS / Windows build with plain cargo, no extra system deps (rustls is pure Rust, boxlite off by default).
# The CLI is a pure-Rust stack (no build.rs, no openssl), so Nix is not needed anywhere.

on:
  # Tags pushed by release-plz with GITHUB_TOKEN do not trigger push (recursion guard), but the
  # Release it creates emits a release: published event — we trigger on that.
  release:
    types: [published]
  # Manual trigger to (re)upload a given version's binaries (specify the tag).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build binaries for (e.g. v0.1.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: ominiforge-linux-x86_64
            bin: ominiforge
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: ominiforge-macos-aarch64
            bin: ominiforge
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: ominiforge-windows-x86_64.exe
            bin: ominiforge.exe
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Reuse the release target across runs; isolate the key per target so the three platforms don't clobber each other.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-cli-${{ matrix.target }}
      - name: Install musl cross toolchain (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the CLI binary
        run: cargo build --release --locked -p ominiforge-cli --target ${{ matrix.target }}

      # Store the binary directly as an artifact under its platform-suffixed name (no archive).
      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ matrix.asset }}
          retention-days: 1

  upload:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Upload every binary to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh release upload needs the target repo; with no checkout, set GH_REPO explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" ./ominiforge-* --clobber
