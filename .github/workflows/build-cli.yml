name: Build CLI binaries

# 当 release-plz 给 ominiforge-cli 打 tag（合并 Release PR 后）时，为三大平台构建
# 纯 CLI 二进制并上传到对应的 GitHub Release。CLI 是纯 Rust 栈（rustls、无 build.rs、
# boxlite 默认关闭），直接用 cargo 跨平台编译，无需 Nix。GUI 桌面包另行处理（占位）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: ominiforge-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: ominiforge-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: ominiforge-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the CLI binary
        run: cargo build --release --locked -p ominiforge-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/ominiforge
          tar -czf ${{ matrix.name }} -C target/${{ matrix.target }}/release ominiforge
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ominiforge.exe `
            -DestinationPath ${{ matrix.name }}

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "${{ matrix.name }}" --clobber
