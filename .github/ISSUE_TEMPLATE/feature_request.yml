name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For large features, discuss in
        [Discussions](https://github.com/OminiForge/ominiforge/discussions) first,
        then open an Issue to track implementation.

  - type: textarea
    id: problem
    attributes:
      label: The problem to solve
      description: What pain point are you hitting? Why isn't the current behavior enough?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behavior / API / interaction do you want?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches? Why do you prefer yours?

  - type: checkboxes
    id: scope
    attributes:
      label: Willing to contribute
      options:
        - label: I'm willing to open a PR implementing this
