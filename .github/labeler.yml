# Path rules for actions/labeler: auto-apply module labels to PRs.
# The labels must already exist under repo Settings → Labels (see CONTRIBUTING.md).

core:
  - changed-files:
      - any-glob-to-any-file: crates/ominiforge-core/**

ui:
  - changed-files:
      - any-glob-to-any-file: crates/ominiforge-ui/**

net:
  - changed-files:

app:
  - changed-files:
      - any-glob-to-any-file: crates/ominiforge-app/**

docs:
  - changed-files:
      - any-glob-to-any-file:
          - doc/**
          - "**.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - justfile
          - flake.nix
          - "**.toml"
