name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Every Monday 02:00 UTC, auto-refresh the Release PR (version/changelog ready);
  # whether to merge and release is still your call. To make it biweekly/monthly, adjust cron.
  schedule:
    - cron: "0 2 * * 1"

# release-plz drives releases: it parses Conventional Commits to maintain a Release PR
# (bump version + generate CHANGELOG); on merge it tags, creates a GitHub Release, and
# publishes the publishable crates to crates.io in topological order
# (ominiforge -> ominiforge-cli).
# No manual version edits needed. (The GPUI GUI desktop package was removed in the zero-UI
# pivot; only the CLI ships binaries.)

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # release-pr: maintain/refresh the Release PR. Runs on push / schedule / manual to keep it current.
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release: actually tag + publish to crates.io + create the Release. **Runs only on push
      # (merging the Release PR)** — never on schedule/manual, or a scheduled tick would publish
      # without a merge.
      - name: Release (tag + GitHub Release + crates.io publish)
        if: github.event_name == 'push'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Rebuild the full-version doc site and deploy to GitHub Pages on every push to master
  # (including releases). Schedule/manual triggers do not redeploy (docs update only after code
  # actually changes).
  docs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history is needed to build each version's docs
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Build multi-version doc site
        run: nix develop --command doc/build-all-versions.sh doc/site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
